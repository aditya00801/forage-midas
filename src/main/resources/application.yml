server:
  port: 33400

general:
  kafka-topic: "financial_transactions"

spring:
  kafka:
    consumer:
      auto-offset-reset: earliest
      group-id: midas
  datasource:
    url: jdbc:h2:mem:midas;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update